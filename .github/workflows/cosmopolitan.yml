# SPDX-License-Identifier: Apache-2.0
# Build the 20-device world with cosmocc on every Linux runner, for that runner's CPU.
# Then validate and time the binaries on every runner OS and CPU: Linux, Windows and macOS,
# x86-64 and AArch64.
#
# Building needs Linux: upstream Zephyr's native_sim build refuses other hosts. Each build
# targets the builder's own CPU; there are no fat binaries.
#
# Windows on ARM cannot run a native build: Cosmopolitan 4.0.2 supports Windows on x86-64
# only (libc/dce.h: SUPPORT_VECTOR is Linux | XNU | FreeBSD on AArch64, and AArch64 output is
# an ELF file without PE headers). Those runners run the x86-64 APE under Windows' x64
# emulation instead, labeled "emulated", without blocking the workflow.
name: Cosmopolitan native_sim

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Also check the 10-minute and one-hour references
        type: boolean
        default: false

env:
  ZEPHYR_REF: v4.5.0
  COSMOCC_VERSION: 4.0.2
  FULL: ${{ inputs.full && '1' || '' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, ubuntu-22.04-arm, ubuntu-24.04-arm, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Check out upstream Zephyr ${{ env.ZEPHYR_REF }}
        uses: actions/checkout@v5
        with:
          repository: zephyrproject-rtos/zephyr
          ref: ${{ env.ZEPHYR_REF }}
          path: zephyr
          fetch-depth: 1
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build make curl unzip python3-venv
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyelftools pyyaml pykwalify packaging jsonschema
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Cache the cosmocc download
        uses: actions/cache@v4
        with:
          path: build/dl
          key: cosmocc-${{ env.COSMOCC_VERSION }}
      - name: Build (firmware once, then every runner backend)
        run: ZEPHYR_BASE="$PWD/zephyr" ./run.sh build
      - name: Register the APE loader
        run: tools/ci/ape-binfmt.sh build/cosmocc-$COSMOCC_VERSION
      - name: Validate
        run: ./run.sh validate | tee validate.txt
      - name: Package
        run: |
          arch=$(uname -m)
          mkdir -p dist/cosmocc/bin
          cp build/cosmocc-$COSMOCC_VERSION/bin/{ape-m1.c,ape-x86_64.elf,ape-aarch64.elf} dist/cosmocc/bin/
          (cd build && find "$arch" -name 'simulator.com*' -type f) | tar -C build -cf - -T - | tar -C dist -xf -
          tar -C dist -czf "simulators-$arch.tar.gz" .
          {
            echo "### Built on ${{ matrix.os }} ($arch)"
            echo '```'
            (cd build && sha256sum "$arch"/*/simulator.com)
            grep -E 'FAIL|skip' validate.txt || echo "validate: $(grep -c '^  ok' validate.txt) checks passed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: simulators-${{ matrix.os }}
          path: simulators-*.tar.gz
          retention-days: 14

  run:
    name: run ${{ matrix.os }} (${{ matrix.arch }}${{ matrix.emulated && ', emulated' || '' }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, arch: x86_64 }
          - { os: ubuntu-24.04, arch: x86_64 }
          - { os: ubuntu-26.04, arch: x86_64 }
          - { os: ubuntu-22.04-arm, arch: aarch64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
          - { os: ubuntu-26.04-arm, arch: aarch64 }
          - { os: windows-2022, arch: x86_64 }
          - { os: windows-2025, arch: x86_64 }
          - { os: windows-11-arm, arch: x86_64, emulated: true }
          - { os: windows-11-vs2026-arm, arch: x86_64, emulated: true }
          - { os: macos-15-intel, arch: x86_64 }
          - { os: macos-26-intel, arch: x86_64 }
          - { os: macos-15, arch: aarch64 }
          - { os: macos-26, arch: aarch64 }
          - { os: xcode-27, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.emulated == true }}
    env:
      BUILD: ${{ github.workspace }}/build
      COSMOCC: ${{ github.workspace }}/build/cosmocc
      COSMO_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
      - name: Download the ${{ matrix.arch }} build from Ubuntu 24.04
        uses: actions/download-artifact@v4
        with:
          name: simulators-${{ matrix.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
      - name: Unpack
        run: mkdir -p build && tar -C build -xzf "simulators-$COSMO_ARCH.tar.gz"
      - name: Register the APE loader
        if: runner.os == 'Linux'
        run: tools/ci/ape-binfmt.sh build/cosmocc
      - name: Validate
        run: bash ./run.sh validate
      - name: Time every backend
        run: |
          SAMPLES=3 bash ./run.sh bench
          {
            echo "### ${{ matrix.os }} (${{ matrix.arch }}${{ matrix.emulated && ', emulated' || '' }})"
            cat build/results/*/results.md
          } >> "$GITHUB_STEP_SUMMARY"

  reproducibility:
    name: compare builds
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: simulators-*
      - name: Compare the executables built on different Ubuntu releases
        run: |
          {
            echo "### Executables by build host"
            echo '| Build host | Architecture | Backend | SHA-256 |'
            echo '|---|---|---|---|'
            for archive in simulators-*/simulators-*.tar.gz; do
              host=$(dirname "$archive"); host=${host#simulators-}
              mkdir -p "unpacked/$host" && tar -C "unpacked/$host" -xzf "$archive"
              (cd "unpacked/$host" && sha256sum */*/simulator.com) | while read -r sum file; do
                echo "| $host | ${file%%/*} | $(basename "$(dirname "$file")") | \`${sum:0:16}\` |"
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"
