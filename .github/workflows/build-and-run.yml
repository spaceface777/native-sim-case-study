# SPDX-License-Identifier: Apache-2.0
# Every runner builds the world for its own OS and CPU, then checks and times it. It also
# builds and runs Zephyr's own samples and test suites as ordinary native_sim executables.
# Cosmopolitan has no Windows on ARM support: those runners build and run x86-64 under
# emulation, without failing the workflow.
name: Build and run

on: [push, pull_request, workflow_dispatch]

jobs:
  run:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, ubuntu-22.04-arm, ubuntu-24.04-arm,
             ubuntu-26.04-arm, windows-2022, windows-2025, windows-11-arm, windows-11-vs2026-arm,
             macos-15-intel, macos-26-intel, macos-15, macos-26, xcode-27]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ startsWith(matrix.os, 'windows') && endsWith(matrix.os, '-arm') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: zephyrproject-rtos/zephyr
          ref: v4.5.0
          path: zephyr
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Zephyr's minimum
      - name: Install Zephyr's requirements
        run: |
          git -C zephyr apply ../zephyr.patch
          python -m venv venv
          . venv/*/activate
          pip install cmake ninja pyelftools pyyaml pykwalify packaging jsonschema \
            pytest tabulate natsort psutil colorama ply junitparser python-dotenv anytree
      - name: Let Linux start Cosmopolitan programs
        if: runner.os == 'Linux'
        # Some images register a binfmt_misc handler (Mono's) that claims all "MZ" files.
        run: for f in /proc/sys/fs/binfmt_misc/*; do ! grep -qs '^magic 4d5a' "$f" || echo -1 | sudo tee "$f"; done
      - uses: actions/cache@v4
        with:
          path: build/cosmocc-4.0.2.zip
          key: cosmocc-4.0.2
      - name: Build
        run: . venv/*/activate && ZEPHYR_BASE="$PWD/zephyr" ./run.sh build
      - name: Check and time
        timeout-minutes: 60 # Intel Mac runners take 30 minutes for the pthreads hour
        run: ./run.sh check bench | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Zephyr samples and tests, with twister
        if: always()
        timeout-minutes: 45
        run: . venv/*/activate && ZEPHYR_BASE="$PWD/zephyr" ./run.sh zephyr
